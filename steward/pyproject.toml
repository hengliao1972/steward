[project]
name = "steward"
version = "0.0.1"
description = "Steward Phase 0: world simulation, rendering, and robot Ego Runtime"
requires-python = ">=3.11"
dependencies = [
  "mujoco>=3.3",
  "numpy>=1.26",
  "pillow>=10.0",
  "mink>=1.3",  # 6-DoF arm IK on the robot's own model (PyRoki refuses 6-DoF)
  "zstandard>=0.23",  # DSH session files, without a zstd executable on PATH
]

[project.optional-dependencies]
providers = ["requests>=2.31"]
localization = ["scipy>=1.11"]

[project.scripts]
steward = "steward.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
