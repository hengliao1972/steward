# Runtime calibration for the imported split_aloha_mid_360_with_piper robot.
# Paths are relative to this file; STEWARD_AGILEX_USD_CONFIG selects another profile.
template = "../assets/agilex/runtime/template.json"
# Raw USD lift joint coordinate in metres; limits come from the template.
lift_home = -0.45
arm_kp = 1500.0
arm_damping = 60.0
arm_effort = 100.0
lift_kp = 30000.0
lift_damping = 1800.0
lift_effort = 5000.0
finger_kp = 300.0
finger_damping = 5.0
finger_effort = 100.0
# Simulated RGB-D rig on the USD top-camera link; not a physical calibration.
survey_pitch_deg = 30.0
work_pitch_deg = 45.0

# x/y in metres, yaw in radians; planar abstraction, not wheel dynamics.
[base]
kp = [10000.0, 10000.0, 3500.0]
damping = [1800.0, 1800.0, 500.0]
effort = [1200.0, 1200.0, 700.0]
velocity = [0.5, 0.5, 1.0]

# Mount offsets are relative to the USD top_camera_link, in metres.
[cameras.head]
size = [320, 240]
fovy_deg = 60.0
position = [0.05, 0.0, 0.0]
rate_hz = 10.0

[cameras.wide]
size = [480, 360]
fovy_deg = 100.0
position = [0.05, 0.0, -0.05]
rate_hz = 10.0

# Shared Piper solver settings for this body: metres, radians and seconds.
# Joint limits and TCP come from USD.
# deploy_joints is an IK/deployment seed; both arms still start and home at zero.
[arm]
arm = "L"
deploy_joints = [0.0, 1.57, -1.35, 0.0, 0.0, 0.0]
shoulder_above = 0.15
shoulder_drop_per_pitch = 0.38
pitch_tolerance = 0.03
pitch_margin = 0.1
torso_seed_inset = 0.05
continuation_reach = 0.35
continuation_steps = 6
reach = [0.10, 0.66]
lift_below_mount = 0.39
lift_above_mount = 0.42
wrist_yaw_max = 3.1
wrist_roll_max = 3.141592653589793
wrist_pitch_max = 1.05
pitch_unseen_cos = 0.1
pitch_read_slack = 0.02
roll_about_x_pitch = 0.35
roll_about_x_max = 1.6907963267948967
drive_tip_roll_floor = 1.05
max_joint_step = 0.6
max_swing_m = 0.03
max_turn_swing_m = 0.05
turn_lower_step = 0.02
turn_link_clearance = 0.02
self_clearance = 0.01
small_step = [0.05, 0.2]
arrived_rad = 0.04
joint_limit_margin = 0.03
home_speed_rad_s = 0.6
home_settle_s = 8.0

# Virtual lift is TCP height above the floor, not the raw USD lift joint.
# Workspace-dependent working/exit heights are computed from this body's IK.
[motion]
linear_speed = 0.45
angular_speed = 0.9
look_angular_speed = 0.6
gentle_speed = 0.25
gentle_turn_speed = 0.4
retract_reach = 0.28
reach_max = 0.70
align_max = 0.25
joint_tol = 0.10
# Release checks measured TCP position, including the solver's millimetre residual.
release_joint_tol = 0.008
release_settle_s = 0.6
arm_speed = 0.3
settle_s = 2.0
grasp_wait_s = 0.35
stow_lift = 0.75

[planning]
edge_grasp_first = true
place_edge_margin = 0.05
flip_in_air = true
handle_reach = 0.25
capture_radius = 0.12
handle_probes_side_m = [0.06, -0.06, 0.10, -0.10, 0.14, -0.14]
handle_probes_along_m = [0.04, 0.08, 0.12, -0.05, -0.09, 0.16]
min_require_tilt = 0.25
# Under a cabinet top, enter at a tilted front-side grasp through the exposed gap.
drawer_entry_pitch = 0.5
drawer_grasp_raise = 0.035
drawer_grasp_backoff = 0.035
drawer_entry_backoff = 0.05
receipt_ttl = 300.0
place_clearance = 0.18
spot_shift_max = 0.85
pour_hold_s = 3.0
pour_roll = 2.3 # Requested wrist rotation; the whole path must also be reachable.
pour_roll_min = 1.7 # Required container tilt from world upright, not wrist rotation.

# Approach, withdrawal and recovery policy (TCP positions in metres).
[trajectory]
handle_lower_clearance = 0.10
approach_floor = 0.85
intermediate_reaches = [0.40, 0.44, 0.48]
reach_attempts = 9
unfurl_attempts = 6
base_adjustment = 0.04
redock_reach = 0.48
recovery_lift_max = 1.28
handle_lower_reaches = [0.36, 0.42]
handle_reach_cap = 0.44
